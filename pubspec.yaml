name: disassembler
description: Native instruction decoding with Zydis, exarmo and Capstone
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.1.4
  hooks: ^2.2.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.5
  record_use: ^1.1.1
dev_dependencies:
  analyzer: ^14.5.0
  dart_style: ^3.1.13
  ffigen: ^23.0.0
  test: ^1.32.0
  xml: ^7.1.0
hooks:
  user_defines:
    disassembler:
      backends:
        zydis:
          architectures: [x86]
          features: [decoder, encoder, formatter]
        exarmo:
          architectures: [arm, arm64]
          features: [decoder]
        capstone:
          architectures: [arm, arm64, m68k, mips, ppc, sparc, systemz, xcore, x86, tms320c64x, m680x, evm, mos65xx, wasm, bpf, riscv, sh, tricore, alpha, hppa, loongarch, xtensa, arc]
          features: [decoder]
